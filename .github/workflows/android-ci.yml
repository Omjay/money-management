name: Android security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/project
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Test and build release
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify release APK permissions
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_SMS|READ_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo "Release APK contains a forbidden permission" >&2
            exit 1
          fi
      - name: Verify root phone APK when present
        shell: bash
        run: |
          APK=../../Hisaab.apk
          if [ ! -f "$APK" ]; then
            echo 'Root APK is not present yet; draft PR is incomplete.'
            exit 0
          fi
          SIGNATURE=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNATURE" | grep -Fq '889aceb4f478bbfd13119788955ff0d4f2e584723d06c8415e15a7ec82cf523b'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "application-label:'Hisaab'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q application-debuggable; then
            echo 'Root APK must not be debuggable' >&2
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_SMS|READ_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo 'Root APK contains a forbidden permission' >&2
            exit 1
          fi
      - name: Verify repository privacy
        shell: pwsh
        run: ./scripts/verify_repository_privacy.ps1
