name: Build private release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BHAIPAISA_SIGNING_STORE_FILE: ${{ runner.temp }}/bhaipaisa-release.jks
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Require private signing secrets
        shell: bash
        env:
          BHAIPAISA_KEYSTORE_BASE64: ${{ secrets.BHAIPAISA_KEYSTORE_BASE64 }}
          BHAIPAISA_SIGNING_STORE_PASSWORD: ${{ secrets.BHAIPAISA_SIGNING_STORE_PASSWORD }}
          BHAIPAISA_SIGNING_KEY_ALIAS: ${{ secrets.BHAIPAISA_SIGNING_KEY_ALIAS }}
          BHAIPAISA_SIGNING_KEY_PASSWORD: ${{ secrets.BHAIPAISA_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$BHAIPAISA_KEYSTORE_BASE64"
          test -n "$BHAIPAISA_SIGNING_STORE_PASSWORD"
          test -n "$BHAIPAISA_SIGNING_KEY_ALIAS"
          test -n "$BHAIPAISA_SIGNING_KEY_PASSWORD"
      - name: Restore private signing key
        shell: bash
        env:
          BHAIPAISA_KEYSTORE_BASE64: ${{ secrets.BHAIPAISA_KEYSTORE_BASE64 }}
        run: printf '%s' "$BHAIPAISA_KEYSTORE_BASE64" | base64 --decode > "$BHAIPAISA_SIGNING_STORE_FILE"
      - name: Test and build signed release
        env:
          BHAIPAISA_SIGNING_STORE_PASSWORD: ${{ secrets.BHAIPAISA_SIGNING_STORE_PASSWORD }}
          BHAIPAISA_SIGNING_KEY_ALIAS: ${{ secrets.BHAIPAISA_SIGNING_KEY_ALIAS }}
          BHAIPAISA_SIGNING_KEY_PASSWORD: ${{ secrets.BHAIPAISA_SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify release signature and manifest
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q application-debuggable; then
            echo "Release APK is unexpectedly debuggable" >&2
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -Eq 'android.permission.(INTERNET|READ_SMS|READ_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo "Release APK contains a forbidden permission" >&2
            exit 1
          fi
      - name: Upload verified APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BhaiPaisa-private-release
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$BHAIPAISA_SIGNING_STORE_FILE"
